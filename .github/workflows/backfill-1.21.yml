name: Backfill 1.21.x into v2.0.0

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v2.0.0
  VERSIONS: 1.21.4 1.21.5 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check mod_version matches the release
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          if [ "$MOD_VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::mod_version '$MOD_VERSION' does not match $RELEASE_TAG"
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build 1.21.x
        run: ./gradlew $(for v in $VERSIONS; do printf ':%s:build ' "$v"; done)

      - name: Find jars
        id: jars
        run: |
          JARS=""
          for v in $VERSIONS; do
            JAR="versions/$v/build/libs/ScaledDragonFight-${RELEASE_TAG}+$v.jar"
            if [ ! -f "$JAR" ]; then
              echo "::error::Missing $JAR"
              exit 1
            fi
            JARS="$JARS $JAR"
          done
          echo "$JARS"
          echo "paths=$JARS" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        id: changelog
        run: |
          CONTENT=$(awk '/^## /{if(p) exit; p=1; next} p' CHANGELOG.md)
          if [ -z "$CONTENT" ]; then
            echo "::error::No changelog section found in CHANGELOG.md"
            exit 1
          fi
          echo "content<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CONTENT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Add jars to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          JARS: ${{ steps.jars.outputs.paths }}
          NOTES: ${{ steps.changelog.outputs.content }}
        run: |
          gh release upload "$RELEASE_TAG" $JARS --clobber
          gh release edit "$RELEASE_TAG" --notes "$NOTES"

      - name: Publish 1.21.x to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CHANGELOG: ${{ steps.changelog.outputs.content }}
        run: ./gradlew $(for v in $VERSIONS; do printf ':%s:publishMods ' "$v"; done)
